[package]
name = "r-server"
version = "0.1.7"
edition = "2024"
description = "Reactive Http Server"
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/reftch/r-server"
repository = "https://github.com/reftch/r-server"
keywords = ["http", "server", "reactive"]
categories = ["network-programming"]

[dependencies]
libc = "0.2"
memchr = "2"
openssl = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = "line-tables-only"

[profile.release]
strip = true
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[workspace]
resolver = "2"
members = [
    ".",
    "examples/client",
    "examples/forms/form",
    "examples/forms/multipart",
    "examples/http",
    "examples/https",
    "examples/middleware",
    "examples/rest",
    "examples/sse",
    "examples/static",
    "examples/templating/tera",
]
