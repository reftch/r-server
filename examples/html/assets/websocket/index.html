<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>R-Server WS Example</title>
        <link rel="stylesheet" href="styles.css" />

        <script src="https://cdn.jsdelivr.net/npm/htmx.org@4.0.0-beta5/dist/htmx.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/htmx.org@4.0.0-beta5/dist/ext/hx-ws.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/htmx.org@4.0.0-beta5/dist/ext/hx-sse.js"></script>
    </head>

    <body>
        <div class="container">
            <nav><a href="/">::Home</a></nav>
            <h2>Websocket Demo</h2>

            <div
                hx-ws:connect="/wstime"
                hx-target="#wstime"
                hx-swap="outerHTML"
            >
                <div id="wstime"></div>
            </div>
        </div>
    </body>
</html>
